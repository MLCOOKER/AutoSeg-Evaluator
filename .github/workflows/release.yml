name: Release

# Builds the portable Windows and Linux bundles and attaches both to a GitHub
# Release whenever a tag matching ``v*`` is pushed (e.g.
# ``git tag v3.0.0 && git push --tags``). Each bundle is hospital-IT
# inspectable: a self-contained CPython 3.11 with the project source and
# dependencies copied alongside as plain files, started by a one-line launcher.
# See scripts/build_portable.py.
#
# Run by hand (Actions -> Release -> Run workflow) it builds and smoke-tests
# both bundles and keeps them as workflow artifacts, without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-windows:
    name: Build portable Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (build host)
        uses: actions/setup-python@v5
        with:
          # The build host Python is only used to run build_portable.py.
          # The bundle itself ships its own pinned CPython (see PY_VERSION
          # in scripts/build_portable.py), independent of this version.
          python-version: "3.11"

      - name: Build portable bundle
        run: python scripts/build_portable.py

      # With the bundle's own interpreter, from outside the repository, so a
      # dependency missing from requirements.txt fails here, not on a user's
      # machine.
      - name: Smoke-test the bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $bundle = Get-ChildItem -Path dist -Directory -Filter "AutoSegEvaluator-v*" | Select-Object -First 1
          if (-not $bundle) { throw "No bundle folder found in dist/" }
          Set-Location $env:RUNNER_TEMP
          & "$($bundle.FullName)\python\python.exe" "$env:GITHUB_WORKSPACE\scripts\smoke_test_bundle.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate built artifact
        id: artifact
        run: |
          $zip = Get-ChildItem -Path dist -Filter "AutoSegEvaluator-v*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No bundle zip found in dist/" }
          "path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

  # Built on the oldest Ubuntu runner, so pip can only choose wheels that run
  # there; the build reads the glibc the bundle needs from those wheels and
  # writes it into the bundle's README.
  build-portable-linux:
    name: Build portable Linux bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (build host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable bundle
        run: python scripts/build_portable.py

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: dist/AutoSegEvaluator-v*-linux-x86_64.tar.gz
          retention-days: 30

  # On a clean runner, from the archive a user would download: an extracted
  # tarball must start with nothing but the libraries a desktop already has.
  smoke-test-linux:
    name: Smoke-test Linux bundle (${{ matrix.os }})
    needs: build-portable-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash  # -eo pipefail
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the X11 libraries a desktop has and a runner lacks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libxcb-xkb1 libfontconfig1

      - uses: actions/download-artifact@v4
        with:
          name: bundle-linux
          path: ${{ runner.temp }}/download

      - name: Extract and smoke-test the bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd "$RUNNER_TEMP"
          tar -xzf download/AutoSegEvaluator-v*-linux-x86_64.tar.gz
          bundles=(AutoSegEvaluator-v*-linux-x86_64/)
          bundle=${bundles[0]}
          test -x "${bundle}run-autoseg-evaluator.sh"
          test -x "${bundle}add-to-applications-menu.sh"
          sed -n '/Requirements:/,/ldd/p' "${bundle}README.txt"
          "${bundle}python/bin/python3" "$GITHUB_WORKSPACE/scripts/smoke_test_bundle.py"

  publish:
    name: Publish GitHub Release
    needs: [build-portable-windows, smoke-test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Attach both bundles to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            **Portable bundles** — no Python install required, nothing installed.

            **Windows 10 / 11 (64-bit):** download `AutoSegEvaluator-v….zip`,
            extract it anywhere (including a USB stick), and double-click
            `Run AutoSeg Evaluator.bat`.

            **Linux (x86-64):** download `AutoSegEvaluator-v…-linux-x86_64.tar.gz`,
            extract it (`tar -xzf …`), and run `./run-autoseg-evaluator.sh`.
            The `README.txt` inside states the oldest glibc it needs.

            Each bundle ships a self-contained CPython 3.11 runtime and every
            dependency as inspectable files under `site-packages` — no frozen
            executable, hospital-IT friendly — and the validated compiled
            engine for the 2D contour metrics.

            See the [README](https://github.com/MLCOOKER/AutoSeg-Evaluator/blob/main/README.md)
            for usage, citation, and source installation.
